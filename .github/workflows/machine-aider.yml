name: MACHINE Copilot Executor

on:
  issues:
    types: [labeled, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  execute-bounded-machine-task:
    if: startsWith(github.event.issue.title, 'MACHINE:') && contains(github.event.issue.labels.*.name, 'enhancement')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated ZURU environment
        run: |
          python -m venv /tmp/zuru-venv
          /tmp/zuru-venv/bin/python -m pip install --upgrade pip
          /tmp/zuru-venv/bin/pip install -r requirements.txt

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Prepare bounded branch and prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASELINE_SHA="$(git rev-parse HEAD)"
          BRANCH="executor/copilot-issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          ISSUE_TITLE="$(gh issue view '${{ github.event.issue.number }}' --json title --jq '.title')"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "ISSUE_TITLE=$ISSUE_TITLE" >> "$GITHUB_ENV"
          git config user.name "MACHINE Copilot Executor"
          git config user.email "machine-copilot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          gh issue view '${{ github.event.issue.number }}' --json title,body --jq '.title + "\n\n" + .body' > /tmp/machine-task.md
          printf '%s\n' '' 'EXECUTOR RULES:' '- Work only on this bounded issue.' '- Preserve normalized DXF evidence as source truth.' '- Do not add DWG ingestion unless the issue explicitly authorizes it.' '- Do not require external AI APIs for deterministic product behavior.' '- Add and run the tests required by the issue.' '- Do not merge main.' '- Do not create or switch branches.' '- Do not commit, push, or open a pull request; the MACHINE wrapper owns delivery.' '- Implement the change in the current working tree; do not merely describe it.' '- Make actual repository edits before returning.' >> /tmp/machine-task.md

      - name: Execute bounded task with GitHub Copilot CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          copilot --yolo -p "$(cat /tmp/machine-task.md)"

      - name: Verify executor changes
        run: |
          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$CURRENT_BRANCH" != "$BRANCH" ]; then
            echo "Executor escaped bounded branch: expected $BRANCH, got $CURRENT_BRANCH"
            exit 1
          fi
          git diff --check "$BASELINE_SHA"
          /tmp/zuru-venv/bin/python -m unittest discover -v
          /tmp/zuru-venv/bin/python -m py_compile dxf_evidence.py evidence_classifier.py zuru_core.py zuru_simple.py
          if git diff --quiet "$BASELINE_SHA" HEAD && git diff --quiet && git diff --cached --quiet; then
            echo 'Executor produced no implementation changes relative to baseline.'
            exit 1
          fi

      - name: Remove generated runtime artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if find . -type f \( -name '*.pyc' -o -name '*.pyo' \) | grep -q .; then
            echo 'Generated Python cache artifacts remain after cleanup.'
            exit 1
          fi

      - name: Commit and push bounded result
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "Executor: Issue #${{ github.event.issue.number }} bounded implementation"
          fi
          if git diff --quiet "$BASELINE_SHA" HEAD; then
            echo 'No committed implementation delta exists relative to baseline.'
            exit 1
          fi
          git push origin "$BRANCH"

      - name: Open draft PR for MACHINE review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "Executor: Issue #${{ github.event.issue.number }} — $ISSUE_TITLE" \
            --body "Delegated implementation for Issue #${{ github.event.issue.number }}. Generated by the bounded MACHINE Copilot CLI executor. Baseline-delta verification and automated tests passed before push. This PR MUST NOT be merged until MACHINE review and explicit Human Gate."; then
            gh issue comment '${{ github.event.issue.number }}' \
              --body "MACHINE delivery ready on branch \`$BRANCH\`; automated PR creation is blocked by repository Actions policy. MACHINE must open the draft PR through an authorized channel before review."
          fi

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' \
            --body 'MACHINE Copilot executor run failed before producing a verified delivery. Inspect the Actions run; do not merge or bypass the failure.'
