name: MACHINE Aider Executor

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  models: read

jobs:
  execute-bounded-machine-task:
    if: github.event.issue.number == 2 && github.event.label.name == 'enhancement'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install executor
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat
          pip install -r requirements.txt

      - name: Prepare bounded task branch and prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="executor/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "MACHINE Aider Executor"
          git config user.email "machine-aider@users.noreply.github.com"
          git checkout -b "$BRANCH"
          gh issue view '${{ github.event.issue.number }}' --json title,body --jq '.title + "\n\n" + .body' > /tmp/machine-task.md
          cat >> /tmp/machine-task.md <<'EOF'

EXECUTOR RULES:
- Work only on this bounded issue.
- Preserve normalized DXF evidence as source truth.
- Do not add DWG ingestion.
- Do not require Gemini or any external API for deterministic behavior.
- Add/modify tests required by the issue.
- Do not merge main.
- Make the implementation in the repository. Do not merely describe it.
EOF

      - name: Execute bounded task with Aider + GitHub Models
        env:
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_BASE: https://models.github.ai/inference
        run: |
          aider \
            --model openai/openai/gpt-4o \
            --message-file /tmp/machine-task.md \
            --yes-always \
            --no-auto-commits \
            --no-pretty \
            --no-stream

      - name: Verify executor changes
        run: |
          git diff --check
          python -m unittest discover -v
          python -m py_compile dxf_evidence.py zuru_core.py zuru_simple.py
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Executor produced no implementation changes.'
            exit 1
          fi

      - name: Commit and push bounded result
        run: |
          git add -A
          git commit -m "Executor: Evidence-Bound Element Classification v1"
          git push origin "$BRANCH"

      - name: Open draft PR for MACHINE review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title 'Executor: Evidence-Bound Element Classification v1' \
            --body 'Delegated implementation for Issue #2. Generated by the bounded MACHINE Aider executor. Automated verification passed before push. This PR MUST NOT be merged until MACHINE review and Human Gate.'

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' \
            --body 'MACHINE delegated executor run failed before producing a verified draft PR. Inspect the GitHub Actions run; do not merge or bypass the failure.'
