name: MACHINE Copilot Executor

on:
  issues:
    types: [labeled, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  execute-bounded-machine-task:
    if: github.event.issue.number == 2 && contains(github.event.issue.labels.*.name, 'enhancement')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated ZURU environment
        run: |
          python -m venv /tmp/zuru-venv
          /tmp/zuru-venv/bin/python -m pip install --upgrade pip
          /tmp/zuru-venv/bin/pip install -r requirements.txt

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Prepare bounded branch and prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="executor/copilot-issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "MACHINE Copilot Executor"
          git config user.email "machine-copilot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          gh issue view '${{ github.event.issue.number }}' --json title,body --jq '.title + "\n\n" + .body' > /tmp/machine-task.md
          printf '%s\n' '' 'EXECUTOR RULES:' '- Work only on this bounded issue.' '- Preserve normalized DXF evidence as source truth.' '- Do not add DWG ingestion.' '- Do not require external AI APIs for deterministic product behavior.' '- Add and run the tests required by the issue.' '- Do not merge main.' '- Implement the change in the repository; do not merely describe it.' '- Make actual repository edits before returning.' >> /tmp/machine-task.md

      - name: Execute bounded task with GitHub Copilot CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          copilot --yolo -p "$(cat /tmp/machine-task.md)"

      - name: Verify executor changes
        run: |
          git diff --check
          /tmp/zuru-venv/bin/python -m unittest discover -v
          /tmp/zuru-venv/bin/python -m py_compile dxf_evidence.py zuru_core.py zuru_simple.py
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Executor produced no implementation changes.'
            exit 1
          fi

      - name: Commit and push bounded result
        run: |
          git add -A
          git commit -m "Executor: Evidence-Bound Element Classification v1"
          git push origin "$BRANCH"

      - name: Open draft PR for MACHINE review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title 'Executor: Evidence-Bound Element Classification v1' \
            --body 'Delegated implementation for Issue #2. Generated by the bounded MACHINE Copilot CLI executor. Automated verification passed before push. This PR MUST NOT be merged until MACHINE review and Human Gate.'

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' \
            --body 'MACHINE Copilot executor run failed before producing a verified draft PR. Inspect the Actions run; do not merge or bypass the failure.'
